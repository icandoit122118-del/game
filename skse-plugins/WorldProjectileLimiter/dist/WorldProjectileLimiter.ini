[General]
; Master switch
bEnabled=true
; Only arrows/bolts/missile ammo projectiles (skip beams/flames when true)
bArrowsOnly=true
; Prefer culling NPC/world projectiles before player-owned ones
bPreservePlayer=true
; Soft cap for live projectiles tracked by Projectile::Manager
iMaxProjectiles=200
; Worker poll interval (ms). Cull work always runs on the game thread.
iIntervalMs=1000

[Debug]
bLogCulls=false
