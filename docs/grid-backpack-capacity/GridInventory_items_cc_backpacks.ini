; Plan — CC Adventurer's Backpack (ccfsvsse001-backpacks.esl) as Grid Inventory bags
; Plugin missing lines are skipped. HDT-SMP Creation Backpacks (Nexus 154157) is mesh-only.
;
; Tiers (inner grid bw x bh). Bedroll variants get +1 row.
;   T1 basic (Leather / Fine / Dark / Fur)     : 5x6 = 30 / bedroll 5x7 = 35
;   T2 specialty (Adventurer / Mage / Hunter / Thief) : 6x9 = 54 / bedroll 6x10 = 60
; Footprint on the main board: all 2x2 (equip + open as bag while worn).
;
; Without a backpack, !pocket keeps only a few main-board rows usable —
; specialty loot lives in these bags.

; ---- T1 basic ----
; Leather Backpack
ccfsvsse001-backpacks.esl|0x000801 = w:2, h:2, rx:0, ry:0, rz:180, scale:1.00, bag:1, bw:5, bh:6
